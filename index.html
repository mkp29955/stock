<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>My Stock Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body {
      margin: 0; padding: 16px; background-color: #f1f5f9; color: #1e293b;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .header h1 { font-size: 20px; font-weight: 800; margin: 0; color: #0f172a; }
    .btn-top {
      padding: 6px 12px; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .tab-container {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      padding: 8px 16px; border: 1px solid #cbd5e1; background: #fff;
      border-radius: 20px; font-size: 14px; font-weight: 600; color: #475569;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .tab-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .tab-add-btn {
      padding: 8px 14px; border: 1px dashed #2563eb; background: #eff6ff;
      border-radius: 20px; font-size: 14px; font-weight: 700; color: #2563eb;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }

    .card {
      background: #ffffff; border-radius: 16px; padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
    }

    .stock-title-area {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;
    }
    .stock-name { font-size: 20px; font-weight: 800; color: #0f172a; }
    .stock-code { font-size: 13px; color: #64748b; margin-top: 2px; }
    .del-stock-btn {
      background: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px;
      color: #b91c1c; font-size: 12px; font-weight: 700; padding: 6px 10px; cursor: pointer;
    }

    /* 차트 박스 */
    .chart-box {
      width: 100%; border-radius: 12px; background: #ffffff;
      border: 1px solid #e2e8f0; padding: 8px; display: flex; flex-direction: column; align-items: center;
    }
    .chart-box img {
      width: 100%; max-height: 220px; object-fit: contain; display: block;
    }
    .chart-tag {
      font-size: 11px; color: #94a3b8; margin-top: 6px; text-align: center;
    }

    .action-links {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;
    }
    .ext-btn {
      display: block; text-align: center; padding: 11px; border-radius: 10px;
      text-decoration: none; font-size: 13px; font-weight: 700;
    }
    .btn-naver { background: #03c75a; color: #ffffff; }
    .btn-dart { background: #f8fafc; color: #334155; border: 1px solid #cbd5e1; }

    .memo-section h3 { font-size: 15px; margin: 0 0 12px 0; color: #1e293b; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
    .input-box {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 13px; outline: none;
    }
    .input-box:focus { border-color: #2563eb; }
    .save-btn {
      width: 100%; padding: 11px; background: #0f172a; color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📈 My Stock Dashboard</h1>
      <button class="btn-top" onclick="refreshDisplay()">새로고침</button>
    </div>

    <div class="tab-container" id="tabContainer"></div>

    <div class="card">
      <div class="stock-title-area">
        <div>
          <div class="stock-name" id="dispName">-</div>
          <div class="stock-code" id="dispCode">-</div>
        </div>
        <button class="del-stock-btn" onclick="deleteCurrentStock()">이 종목 삭제</button>
      </div>

      <!-- 차트 뷰어 (차단 방지 no-referrer 적용 및 정규 일봉 차트 연동) -->
      <div class="chart-box">
        <img id="stockChart" referrerpolicy="no-referrer" src="" alt="차트 연결 중..." />
        <div class="chart-tag" id="chartNotice">일봉 시세 차트</div>
      </div>

      <div class="action-links">
        <a id="linkNaver" href="#" target="_blank" class="ext-btn btn-naver">네이버 시세·차트</a>
        <a id="linkDart" href="#" target="_blank" class="ext-btn btn-dart">전자공시(DART)</a>
      </div>
    </div>

    <div class="card memo-section">
      <h3>🎯 나의 투자 계획 & 메모</h3>
      <div class="input-grid">
        <div class="input-group">
          <label>목표 매수가</label>
          <input type="text" id="targetBuy" class="input-box" placeholder="예: 13,500원" />
        </div>
        <div class="input-group">
          <label>목표 매도가</label>
          <input type="text" id="targetSell" class="input-box" placeholder="예: 16,000원" />
        </div>
      </div>
      <div class="input-group">
        <label>매수 사유 / 배당 일정 / 메모</label>
        <textarea id="stockMemo" class="input-box" rows="3" placeholder="매수 사유, 배당락 일정 등을 기록해 두세요."></textarea>
      </div>
      <button class="save-btn" onclick="saveMemo()">메모 & 목표가 저장</button>
    </div>
  </div>

  <script>
    const defaultStocks = [
      { name: "기업은행", code: "024110" },
      { name: "삼성전자", code: "005930" },
      { name: "KB금융", code: "105560" },
      { name: "현대차", code: "005380" }
    ];

    let myStocks = JSON.parse(localStorage.getItem('my_custom_stocks')) || defaultStocks;
    let currentIndex = 0;

    function renderTabs() {
      const container = document.getElementById('tabContainer');
      container.innerHTML = '';

      myStocks.forEach((stock, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tab-btn ${idx === currentIndex ? 'active' : ''}`;
        btn.innerText = stock.name;
        btn.onclick = () => selectStock(idx);
        container.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'tab-add-btn';
      addBtn.innerText = '+ 종목 추가';
      addBtn.onclick = addNewStock;
      container.appendChild(addBtn);
    }

    function selectStock(index) {
      currentIndex = Number(index);
      if (currentIndex >= myStocks.length) currentIndex = 0;
      renderTabs();
      updateDisplay();
      loadMemo();
    }

    function updateDisplay() {
      if (!myStocks || myStocks.length === 0) {
        document.getElementById('dispName').innerText = '종목을 추가하세요';
        document.getElementById('dispCode').innerText = '------';
        document.getElementById('stockChart').src = '';
        return;
      }

      const stock = myStocks[currentIndex];
      document.getElementById('dispName').innerText = stock.name;
      document.getElementById('dispCode').innerText = `${stock.code} · KOSPI/KOSDAQ`;

      // 네이버 증권 일봉/당일 정규 차트 URL (차단 우회 referrerpolicy 적용)
      const t = new Date().getTime();
      document.getElementById('stockChart').src = `https://fchart.stock.naver.com/item/area.naver?symbol=${stock.code}&timeframe=day&count=60&requestType=0&_t=${t}`;

      document.getElementById('linkNaver').href = `https://m.stock.naver.com/domestic/stock/${stock.code}/total`;
      document.getElementById('linkDart').href = `https://dart.fss.or.kr/dsab007/main.do?textCrpNm=${encodeURIComponent(stock.name)}`;
    }

    function refreshDisplay() {
      updateDisplay();
    }

    function addNewStock() {
      const name = prompt("추가할 회사 이름을 입력하세요:\n(예: SK하이닉스, NAVER)");
      if (!name || !name.trim()) return;

      const code = prompt(`[${name.trim()}]의 6자리 종목코드를 입력하세요:\n(예: 000660)`);
      if (!code || !code.trim()) return;

      myStocks.push({ name: name.trim(), code: code.trim() });
      localStorage.setItem('my_custom_stocks', JSON.stringify(myStocks));
      
      selectStock(myStocks.length - 1);
    }

    function deleteCurrentStock() {
      if (myStocks.length <= 1) {
        alert("최소 1개 이상의 종목이 있어야 합니다.");
        return;
      }
      
      const currentTarget = myStocks[currentIndex];
      const isConfirmed = confirm(`'${currentTarget.name}' 종목을 정말 삭제하시겠습니까?`);
      
      if (isConfirmed) {
        myStocks.splice(currentIndex, 1);
        localStorage.setItem('my_custom_stocks', JSON.stringify(myStocks));
        
        currentIndex = 0;
        renderTabs();
        updateDisplay();
        loadMemo();
      }
    }

    function saveMemo() {
      if (myStocks.length === 0) return;
      const code = myStocks[currentIndex].code;
      const data = {
        buy: document.getElementById('targetBuy').value,
        sell: document.getElementById('targetSell').value,
        memo: document.getElementById('stockMemo').value
      };
      localStorage.setItem(`memo_${code}`, JSON.stringify(data));
      alert(`[${myStocks[currentIndex].name}] 투자 메모가 저장되었습니다.`);
    }

    function loadMemo() {
      if (myStocks.length === 0) return;
      const code = myStocks[currentIndex].code;
      const saved = localStorage.getItem(`memo_${code}`);
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('targetBuy').value = data.buy || '';
        document.getElementById('targetSell').value = data.sell || '';
        document.getElementById('stockMemo').value = data.memo || '';
      } else {
        document.getElementById('targetBuy').value = '';
        document.getElementById('targetSell').value = '';
        document.getElementById('stockMemo').value = '';
      }
    }

    renderTabs();
    selectStock(0);
  </script>
</body>
</html>
