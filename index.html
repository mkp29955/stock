<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>나만의 주식 대시보드</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body {
      margin: 0; padding: 16px; background-color: #f1f5f9; color: #1e293b;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
    
    /* 상단 헤더 */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .header h1 { font-size: 20px; font-weight: 800; margin: 0; color: #0f172a; }
    .refresh-btn {
      padding: 6px 12px; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .refresh-btn:active { opacity: 0.8; }

    /* 종목 선택 탭 */
    .tab-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn {
      padding: 8px 16px; border: 1px solid #cbd5e1; background: #fff;
      border-radius: 20px; font-size: 14px; font-weight: 600; color: #64748b;
      cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .tab-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }

    /* 카드 공통 스타일 */
    .card {
      background: #ffffff; border-radius: 16px; padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
    }

    /* 시세 헤더 영역 */
    .stock-title-area {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;
    }
    .stock-name { font-size: 18px; font-weight: 800; color: #0f172a; }
    .stock-code { font-size: 13px; color: #64748b; }

    /* 모바일 증권 프레임 (실시간 시세 및 1일 차트 직관 연동) */
    .chart-container {
      width: 100%; border-radius: 12px; overflow: hidden; background: #fafafa;
      border: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center;
    }
    .chart-img {
      width: 100%; height: auto; display: block; border-radius: 8px;
    }
    .chart-notice {
      font-size: 11px; color: #94a3b8; margin-top: 6px; text-align: center;
    }

    /* 바로가기 버튼 */
    .action-links {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;
    }
    .ext-btn {
      display: block; text-align: center; padding: 10px; border-radius: 10px;
      text-decoration: none; font-size: 13px; font-weight: 700;
    }
    .btn-naver { background: #03c75a; color: #ffffff; }
    .btn-toss { background: #e0e7ff; color: #3730a3; }

    /* 투자 메모 & 목표가 */
    .memo-section h3 { font-size: 15px; margin: 0 0 10px 0; color: #1e293b; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
    .input-box {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 14px; outline: none;
    }
    .input-box:focus { border-color: #2563eb; }
    .save-btn {
      width: 100%; padding: 10px; background: #0f172a; color: #fff; border: none;
      border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>📈 나만의 주식 대시보드</h1>
      <button class="refresh-btn" onclick="refreshData()">새로고침</button>
    </div>

    <!-- 종목 탭 -->
    <div class="tab-bar" id="tabBar"></div>

    <!-- 시세 및 당일 차트 카드 -->
    <div class="card">
      <div class="stock-title-area">
        <span class="stock-name" id="dispName">기업은행</span>
        <span class="stock-code" id="dispCode">024110</span>
      </div>

      <!-- 실시간 당일 시세 차트 이미지 (CORS 제한 없이 공식 제공) -->
      <div class="chart-container">
        <img id="stockChart" class="chart-img" src="" alt="시세 차트 불러오는 중..." />
        <div class="chart-notice">※ 실시간 네이버 증권 1일 시세 차트 연동</div>
      </div>

      <div class="action-links">
        <a id="linkNaver" href="#" target="_blank" class="ext-btn btn-naver">네이버 증권 상세</a>
        <a id="linkToss" href="#" target="_blank" class="ext-btn btn-toss">토스 증권 보기</a>
      </div>
    </div>

    <!-- 나만의 투자 메모 & 목표가 저장 -->
    <div class="card memo-section">
      <h3>🎯 나의 투자 계획 & 메모</h3>
      <div class="input-group">
        <label>목표 매수가 / 매도가</label>
        <input type="text" id="targetPrice" class="input-box" placeholder="예: 목표가 18,500원" />
      </div>
      <div class="input-group">
        <label>투자 메모</label>
        <textarea id="stockMemo" class="input-box" rows="3" placeholder="매수 이유, 배당 일정 등을 기록하세요."></textarea>
      </div>
      <button class="save-btn" onclick="saveMemo()">메모 저장</button>
    </div>
  </div>

  <script>
    // 관리할 종목 목록
    const stocks = [
      { name: "기업은행", code: "024110" },
      { name: "삼성전자", code: "005930" },
      { name: "현대차", code: "005380" }
    ];

    let currentStock = stocks[0];

    // 탭 생성
    function renderTabs() {
      const tabBar = document.getElementById('tabBar');
      tabBar.innerHTML = '';
      stocks.forEach(stock => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${stock.code === currentStock.code ? 'active' : ''}`;
        btn.innerText = stock.name;
        btn.onclick = () => selectStock(stock);
        tabBar.appendChild(btn);
      });
    }

    // 종목 변경
    function selectStock(stock) {
      currentStock = stock;
      renderTabs();
      updateDisplay();
      loadMemo();
    }

    // 화면 갱신
    function updateDisplay() {
      document.getElementById('dispName').innerText = currentStock.name;
      document.getElementById('dispCode').innerText = currentStock.code;

      // 네이버 증권 공식 실시간 1일 시세 영역 (캐시 방지 타임스탬프 추가)
      const timestamp = new Date().getTime();
      document.getElementById('stockChart').src = 
        `https://ssl.pstatic.net/imgfinance/chart/mobile/mini/${currentStock.code}_end.png?${timestamp}`;

      // 외부 링크 연결
      document.getElementById('linkNaver').href = `https://m.stock.naver.com/domestic/stock/${currentStock.code}/total`;
      document.getElementById('linkToss').href = `https://wts.tossinvest.com/stocks/A${currentStock.code}`;
    }

    // 새로고침 버튼
    function refreshData() {
      updateDisplay();
    }

    // 메모 저장 (스마트폰 기기 로컬 저장소 활용)
    function saveMemo() {
      const target = document.getElementById('targetPrice').value;
      const memo = document.getElementById('stockMemo').value;
      const data = { target, memo };
      localStorage.setItem(`stock_memo_${currentStock.code}`, JSON.stringify(data));
      alert(`${currentStock.name} 메모가 저장되었습니다.`);
    }

    // 메모 불러오기
    function loadMemo() {
      const saved = localStorage.getItem(`stock_memo_${currentStock.code}`);
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('targetPrice').value = data.target || '';
        document.getElementById('stockMemo').value = data.memo || '';
      } else {
        document.getElementById('targetPrice').value = '';
        document.getElementById('stockMemo').value = '';
      }
    }

    // 초기 실행
    renderTabs();
    selectStock(stocks[0]);
  </script>
</body>
</html>
